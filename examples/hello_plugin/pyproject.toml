[project]
name = "pyhost-hello-plugin"
version = "1.0.0"
description = "Minimal example plugin for PyHost"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "pyhost>=0.1,<1"]

[project.entry-points."tool_host.plugins"]
hello = "hello_plugin.plugin:PLUGIN"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_plugin"]

[tool.uv.sources]
pyhost = { workspace = true }
