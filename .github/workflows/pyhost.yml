name: PyHost CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run tests
        run: uv run --extra test pytest

      - name: Build distributions
        run: uv build --package pyhost

      - name: Check distributions
        run: uvx twine check dist/*.whl dist/*.tar.gz
