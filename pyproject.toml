[project]
name = "pyhost"
version = "0.1.0"
description = "Minimal host for independently packaged ASGI plugins"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
pyhost = "tool_host.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_host"]

[tool.uv.workspace]
members = ["examples/hello_plugin"]
